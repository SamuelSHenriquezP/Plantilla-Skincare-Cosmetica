<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB277" />
      <stop offset="100%" stop-color="#D9AE94" />
    </linearGradient>
  </defs>

  <!-- Background Subtle Organic Disc -->
  <circle cx="250" cy="250" r="238" fill="#FFFDF9" stroke="#D9AE94" stroke-width="2.5" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#5D3A24" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Botanical Radiant Star Emblem at Center Top -->
  <g transform="translate(250, 160)">
    <!-- 8-Point Minimalist Star -->
    <path d="M 0 -40 L 7 -12 L 35 0 L 7 12 L 0 40 L -7 12 L -35 0 L -7 -12 Z" fill="url(#auraGold)" />
    <!-- Secondary diagonal delicate rays -->
    <path d="M 0 -22 L 4 -7 L 19 0 L 4 7 L 0 22 L -4 7 L -19 0 L -4 -7 Z" fill="#5D3A24" opacity="0.4" transform="rotate(45)" />
    <circle cx="0" cy="0" r="4" fill="#FFFDF9" />
  </g>

  <!-- Wordmark AURA -->
  <text x="250" y="295" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="300" fill="#5D3A24" text-anchor="middle" letter-spacing="16">
    AURA
  </text>

  <!-- Fine Horizontal Hairline Accent -->
  <line x1="170" y1="318" x2="330" y2="318" stroke="#D9AE94" stroke-width="1" />

  <!-- Subtitle BOTANICAL ATELIER -->
  <text x="250" y="348" font-family="'Jost', sans-serif" font-size="15" font-weight="400" fill="#8C5E41" text-anchor="middle" letter-spacing="10">
    BOTANICAL ATELIER
  </text>
  
  <text x="250" y="375" font-family="'Jost', sans-serif" font-size="11" font-weight="300" fill="#5D3A24" text-anchor="middle" letter-spacing="6" opacity="0.75">
    ORGANIC LUXURY
  </text>
</svg>
